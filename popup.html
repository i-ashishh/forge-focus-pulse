<!doctype html><html><head><meta charset="utf-8"><title>FORGE</title><link rel="stylesheet" href="popup.css"></head><body>
<main>
  <header><div class="brand"><span>F</span><div><strong>FORGE</strong><small>FOCUS PULSE</small></div></div><label class="switch"><input id="enabled" type="checkbox"><i></i></label></header>
  <section class="hero"><div class="eyebrow">CURRENT MODE</div><h1>Stay on the page.<br><em>Return to the work.</em></h1><p>FORGE quietly waits in the background, then places a thought over the page you are already using.</p></section>
  <section class="grid">
    <label>INTERVAL<select id="interval"><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select><span>minutes</span></label>
    <label>CATEGORY<select id="category"><option value="mixed">Mixed</option><option value="jee">JEE Reality</option><option value="discipline">Discipline</option><option value="focus">Focus</option><option value="brutal">Brutal Truth</option><option value="philosophy">Philosophy</option><option value="failure">Failure</option><option value="idea">Ideas</option><option value="villain">Villains</option><option value="story">Story Lab</option></select></label>
  </section>
  <label class="check"><input id="jeeMode" type="checkbox"><span>JEE execution mode</span></label>
  <label class="check"><input id="quietHours" type="checkbox"><span>Quiet hours</span></label>
  <div class="quiet"><input id="quietStart" type="time"><span>to</span><input id="quietEnd" type="time"></div>
  <button id="test" class="test">TEST PULSE</button>
  <div id="status" class="status"></div>
  <footer>Overlay mode • notifications are fallback on restricted pages</footer>
</main><script src="popup.js"></script></body></html>
